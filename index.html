<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Pricee — Calculate selling price, profit margin, costs, and markup." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Pricee — Pricing &amp; Margin Calculator</title>
    <script type="module" crossorigin src="/assets/index-DmLRazhJ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BQI-2vjf.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script>
    <style>
      #pwa-install-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        background: linear-gradient(135deg, #6366f1, #9333ea);
        color: #fff;
        font: 600 14px/1 'Inter', system-ui, sans-serif;
        border: none;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        cursor: pointer;
        animation: pwa-slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #pwa-install-btn.show { display: inline-flex; }
      #pwa-install-btn:active { transform: scale(0.96); }
      #pwa-install-btn svg { width: 16px; height: 16px; }
      @keyframes pwa-slide-in {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <button id="pwa-install-btn" aria-label="Install Pricee app">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" />
      </svg>
      Install Pricee
    </button>

    <script>
      (function () {
        var btn = document.getElementById('pwa-install-btn');
        var deferred = null;

        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferred = e;
          btn.classList.add('show');
        });

        btn.addEventListener('click', function () {
          if (!deferred) return;
          deferred.prompt();
          deferred.userChoice.then(function (choice) {
            if (choice.outcome === 'accepted') {
              btn.classList.remove('show');
            }
            deferred = null;
          });
        });

        window.addEventListener('appinstalled', function () {
          btn.classList.remove('show');
          deferred = null;
        });

        if (window.matchMedia('(display-mode: standalone)').matches) {
          btn.style.display = 'none';
        }
      })();
    </script>
  </body>
</html>
